# Persona fork only (see INFR-4607): keeps the fork's go.sum patched until we
# return to upstream pfnet/kaptest and archive this repository.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
