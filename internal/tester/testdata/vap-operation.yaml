apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: operation-kind
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: "Equivalent"
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["deployments"]
  validations:
  - expression: 'request.operation == "CREATE" || request.operation == "DELETE" || object.spec.replicas == oldObject.spec.replicas'
    message: "request.operation does not match the objects supplied"
